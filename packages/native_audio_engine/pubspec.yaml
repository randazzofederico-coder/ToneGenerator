name: native_audio_engine
description: "Audio engine plugin with real-time oscillator synthesis via C++/miniaudio."
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.elongacion.native_audio_engine
        pluginClass: NativeAudioEnginePlugin
      ios:
        pluginClass: NativeAudioEnginePlugin
      windows:
        pluginClass: NativeAudioEnginePluginCApi
