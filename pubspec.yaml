name: tone_generator
description: "Generador de frecuencias multi-canal con síntesis de ondas en tiempo real."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8
  native_audio_engine:
    path: packages/native_audio_engine
  share_plus: ^12.0.2
  url_launcher: ^6.3.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  app_links: 7.0.0
  crypto: 3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "tonegenerator.png"
  adaptive_icon_background: "#F5E6C8"
  adaptive_icon_foreground: "tonegenerator.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "tonegenerator.png"
    background_color: "#F5E6C8"
    theme_color: "#1A1A2E"

flutter:
  uses-material-design: true
  generate: true
